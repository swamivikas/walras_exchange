services:
  mysql:
    image: mysql:8.0
    container_name: walras-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: walras_exchange
      MYSQL_USER: walras
      MYSQL_PASSWORD: walras
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/001_initial_schema_mysql.sql:/docker-entrypoint-initdb.d/001_initial_schema_mysql.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
